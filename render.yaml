# Render.com Blueprint — auto-deploys JSW Coil OCR
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE (do this once, from any network that reaches render.com):
#   1. Push this repo to GitHub (branch: deploy)
#   2. render.com -> New -> Blueprint -> pick this repo -> branch "deploy"
#   3. Render reads this file, builds the Dockerfile, deploys.
#   4. In Render dashboard -> Environment -> add your Gemini key:
#        GEMINI_API_KEY_1 = <your key from aistudio.google.com/apikey>
#      (optional 2nd/3rd key for more free quota: GEMINI_API_KEY_2, _3)
#   5. Workers open the https://jsw-coil-ocr.onrender.com URL on ANY phone/wifi.
#
# NOTE: free tier sleeps after 15 min idle -> first scan wakes it (~50s cold start).
#       Upgrade to paid ($7/mo) later to keep it always-on. No code change needed.

services:
  - type: web
    name: jsw-coil-ocr
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore        # closest Render region to India
    healthCheckPath: /health
    envVars:
      # All marked "sync: false" = SECRET. The NAME lives here in git, but you
      # type the VALUE in Render after pushing (Blueprint -> Sync prompts you).
      # This is the ONLY reliable way to set env vars on a Blueprint-managed
      # service — hand-adding them in the Environment tab does not persist.
      - key: GEMINI_API_KEY_1
        sync: false           # primary Gemini key (already set)
      - key: GEMINI_API_KEY_2
        sync: false           # 2nd Gemini key (separate Google project = 2x quota)
      - key: GEMINI_API_KEY_3
        sync: false           # 3rd Gemini key (separate Google project = 3x quota)
      - key: DRIVE_UPLOAD_URL
        sync: false           # Google Apps Script /exec URL — saves coil photos to Drive
      # PORT is injected automatically by Render — app.py reads it.
